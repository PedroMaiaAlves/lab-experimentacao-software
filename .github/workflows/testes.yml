name: Testes LAB03

on: [push, pull_request]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Lab03/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --cov=metricas --cov-report=term-missing --cov-fail-under=80
